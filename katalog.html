<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Harga ATK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F7F7F4; color: #141413; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-neutral-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 bg-orange-600 inline-block"></span>
          <span class="font-mono text-[10px] uppercase tracking-widest text-neutral-500">Daftar Harga Resmi</span>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight uppercase mt-0.5">Katalog Harga ATK</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="item-count" class="font-mono text-xs bg-neutral-100 border border-neutral-200 px-2.5 py-1 rounded">Memuat...</span>
        <a href="index.html" class="font-mono text-xs border border-neutral-900 px-3 py-1.5 rounded hover:bg-neutral-900 hover:text-white transition">Login Admin</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-5 space-y-4">
    <!-- Pencarian & Filter -->
    <div class="bg-white border border-neutral-200 rounded-xl p-4 space-y-3 shadow-sm">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <input id="search-input" type="text" placeholder="Cari barang atau kode SKU (misal: hvs f4, pulpen biru, amplop)..."
          class="flex-1 border border-neutral-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-orange-600" />
        <label class="flex items-center gap-2 text-xs font-mono text-neutral-600 px-2 cursor-pointer select-none">
          <input id="only-priced" type="checkbox" class="w-4 h-4 accent-orange-600" />
          <span>Hanya yang sudah ada harga</span>
        </label>
      </div>
      <div id="category-chips" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- Daftar Barang -->
    <div id="catalog-container" class="bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm">
      <div class="p-8 text-center font-mono text-xs text-neutral-500">Mengambil daftar harga terbaru...</div>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    let allItems = [];
    let activeCategory = 'ALL';

    const client = (typeof db !== 'undefined')
      ? db
      : supabase.createClient(
          typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : window.SUPABASE_URL,
          typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : window.SUPABASE_ANON_KEY
        );

    const fmtRp = (n) => Number(n) > 0 ? 'Rp ' + Math.round(Number(n)).toLocaleString('id-ID') : 'Hubungi Admin';
    const esc = (s) => String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

    async function loadCatalog() {
      const { data, error } = await client.rpc('get_public_catalog');
      const box = document.getElementById('catalog-container');

      if (error) {
        box.innerHTML = `<div class="p-6 text-center font-mono text-xs text-red-600">Gagal memuat katalog: ${esc(error.message)}</div>`;
        return;
      }

      allItems = data || [];
      renderCategoryChips();
      renderList();
    }

    function renderCategoryChips() {
      const cats = ['ALL', ...Array.from(new Set(allItems.map(i => i.category))).sort()];
      const el = document.getElementById('category-chips');
      el.innerHTML = cats.map(c => {
        const active = c === activeCategory;
        return `<button type="button" onclick="setCategory('${esc(c).replace(/'/g, "\\'")}')"
          class="px-2.5 py-1 rounded-md text-xs font-mono border transition ${active
            ? 'bg-neutral-900 text-white border-neutral-900'
            : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:border-orange-500'}">
          ${c === 'ALL' ? 'Semua Kategori' : esc(c)}
        </button>`;
      }).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategoryChips();
      renderList();
    }

    function renderList() {
      const terms = document.getElementById('search-input').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const onlyPriced = document.getElementById('only-priced').checked;

      const filtered = allItems.filter(it => {
        if (activeCategory !== 'ALL' && it.category !== activeCategory) return false;
        if (onlyPriced && Number(it.selling_price) <= 0 && Number(it.big_selling_price) <= 0) return false;
        if (terms.length > 0) {
          const hay = `${it.sku} ${it.name} ${it.category}`.toLowerCase();
          if (!terms.every(t => hay.includes(t))) return false;
        }
        return true;
      });

      document.getElementById('item-count').textContent = `${filtered.length} Barang`;
      const box = document.getElementById('catalog-container');

      if (filtered.length === 0) {
        box.innerHTML = '<div class="p-8 text-center font-mono text-xs text-neutral-500">Barang tidak ditemukan.</div>';
        return;
      }

      box.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-neutral-50 border-b border-neutral-200 font-mono text-[10px] uppercase text-neutral-500">
                <th class="p-3">SKU & Nama Barang</th>
                <th class="p-3 hidden sm:table-cell">Kategori</th>
                <th class="p-3 text-right">Harga Satuan</th>
                <th class="p-3 text-right">Harga Grosir / Box</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-neutral-100">
              ${filtered.map(it => {
                const hasPrice = Number(it.selling_price) > 0;
                const hasBig = it.big_unit && Number(it.big_selling_price) > 0;
                return `
                  <tr class="hover:bg-orange-50/40">
                    <td class="p-3">
                      <div class="font-semibold text-neutral-900">${esc(it.name)}</div>
                      <div class="flex items-center gap-2 mt-0.5 font-mono text-[10px] text-neutral-500">
                        <span>${esc(it.sku)}</span>
                        <span class="sm:hidden">• ${esc(it.category)}</span>
                        ${it.in_stock ? '<span class="text-emerald-700 font-semibold">• Tersedia</span>' : ''}
                      </div>
                    </td>
                    <td class="p-3 hidden sm:table-cell font-mono text-xs text-neutral-500">${esc(it.category)}</td>
                    <td class="p-3 text-right font-mono">
                      <div class="font-bold ${hasPrice ? 'text-neutral-900' : 'text-neutral-400 text-xs'}">${fmtRp(it.selling_price)}</div>
                      <div class="text-[10px] text-neutral-500">per ${esc(it.unit)}</div>
                    </td>
                    <td class="p-3 text-right font-mono">
                      ${hasBig
                        ? `<div class="font-bold text-orange-600">${fmtRp(it.big_selling_price)}</div>
                           <div class="text-[10px] text-neutral-500">per ${esc(it.big_unit)}${Number(it.big_qty) > 0 ? ` (isi ${it.big_qty})` : ''}</div>`
                        : '<span class="text-xs text-neutral-300">—</span>'}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    document.getElementById('search-input').addEventListener('input', renderList);
    document.getElementById('only-priced').addEventListener('change', renderList);
    loadCatalog();
  </script>
</body>
</html>
